<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products – Observability Demo Shop</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <h1>Observability Demo Shop</h1>
    <p>Product catalog</p>
    <nav class="header-nav" id="header-nav">
      <span id="nav-user"><span class="user-name" id="nav-user-name"></span> <a href="/profile.html">Profile</a> <a href="/checkout.html" id="nav-cart">Cart (<span id="cart-count">0</span>)</a> <a href="#" id="nav-logout">Log out</a></span>
      <a href="/" class="back-home">Home</a>
    </nav>
  </header>

  <main class="main">
    <section id="products-section" class="section">
      <h2>Products</h2>
      <div id="products-loading" class="loading">Loading products…</div>
      <div id="products-error" class="error" hidden></div>
      <div id="products-list" class="products-grid" hidden></div>
      <div id="products-pagination" class="pagination" hidden></div>
      <p class="products-footer"><a href="/checkout.html" class="btn btn-primary">Go to checkout</a></p>
    </section>
  </main>

  <script src="/auth.js"></script>
  <script src="/cart.js"></script>
  <script src="/products.js"></script>
</body>
</html>
