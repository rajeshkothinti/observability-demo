# Template for postgres-credentials Secret. Do not commit real values.
# 1. Copy to postgres-credentials.yaml (or use script from env) - that file is gitignored.
# 2. Replace placeholders with real values (or use scripts/create-sealed-postgres-secret.sh).
# 3. Seal it: kubeseal -f postgres-credentials.yaml -w postgres-credentials.sealed.yaml
# 4. Apply the sealed file: kubectl apply -f postgres-credentials.sealed.yaml
#
# Required keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL
# DATABASE_URL format: postgresql://USER:PASSWORD@postgres:5432/DATABASE
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: observability
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_POSTGRES_USER"
  POSTGRES_PASSWORD: "REPLACE_POSTGRES_PASSWORD"
  POSTGRES_DB: "REPLACE_POSTGRES_DB"
  DATABASE_URL: "postgresql://REPLACE_USER:REPLACE_PASSWORD@postgres:5432/REPLACE_DB"
