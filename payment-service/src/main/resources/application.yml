server:
  port: 8081

spring:
  application:
    name: ${OTEL_SERVICE_NAME:payment-service}

# OpenTelemetry OTLP (traces) - Boot 3.2 uses HTTP by default; collector HTTP :4318
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info

# Service name for traces (W3C propagation is default in Boot 3)
otel:
  resource:
    attributes: service.name=${OTEL_SERVICE_NAME:payment-service}
